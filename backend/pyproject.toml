[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scenemind-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3", "opencv-python-headless>=4.11,<6", "imageio-ffmpeg>=0.6,<1", "sqlalchemy>=2,<3", "alembic>=1.15,<2"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.2,<2"]
visual = ["torch>=2.6,<3", "transformers>=4.50,<5", "faiss-cpu>=1.10,<2", "pillow>=11,<13"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "faiss-cpu>=1.10,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
